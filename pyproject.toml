[project]
name = "beaverton-creek"
version = "0.1.0"
description = "Calculations for Beaverton Creek"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipython",
    "ipykernel<7",
    "jupyter",
    "jupytext",
    "marimo[recommended]",
    "matplotlib",
    "numpy",
    "pandas",
    "pandas-stubs",
    "PyniteFEA[all]",
    "sectionproperties",
    "scipy",
    "steelpy",
    "sympy",
    # local packages
    "forallpeople",
    "handcalcs",
    "structural_tools",
]

[tool.uv.sources]
structural_tools = { path = "../dev/structural_tools", editable = true }
handcalcs = { path = "../dev/handcalcs", editable = true }
forallpeople = { path = "../dev/forallpeople", editable = true }

[dependency-groups]
dev = ["mypy", "ruff"]

[tool.ruff.lint]
ignore = ["F821"]

[tool.ruff]
line-length = 120

[tool.basedpyright]
typeCheckingMode = "standard"
